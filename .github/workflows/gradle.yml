name: Pipeline CI

# validate-git-constraints -> build -> (testeController | testeService | testeRepository) -> gate-qualidade
#   -> merge-automatico-main (só em push na develop: abre PR develop -> main e faz o merge automático)
# Fluxo: feature -> PR para develop (CI) -> push na develop (CI) -> promoção automática para a main.
# Gates extras: cobertura (JaCoCo, no gate-qualidade), CodeQL e revisão de dependências. Falha na develop abre issue.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  # Branches de trabalho rodam só via pull_request; push evita execução em duplicata.
  push:
    branches: [main, develop]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  validate-git-constraints:
    name: "validate · validate-git-constraints"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar nome da branch
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Branch: $BRANCH"
          if ! echo "$BRANCH" | grep -Eq '^(main|develop|(feature|bugfix|hotfix|release)/.+)$'; then
            echo "::error::Nome de branch inválido: '$BRANCH'. Use main, develop ou feature|bugfix|hotfix|release/<descricao>."
            exit 1
          fi

      - name: Validar origem do PR para a main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "$GITHUB_HEAD_REF" != "develop" ]; then
            echo "::error::PRs para a main só podem vir da develop (origem: '$GITHUB_HEAD_REF'). Abra o PR para a develop."
            exit 1
          fi

      - name: Validar arquivos proibidos no repositório
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "::error::Arquivo .env versionado."
            exit 1
          fi
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md'; then
            echo "::error::Marcadores de conflito de merge encontrados."
            exit 1
          fi

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: "build · build"
    needs: validate-git-constraints
    runs-on: ubuntu-latest
    permissions:
      contents: write # submissão do dependency graph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit

      - name: Compilar e gerar WAR (sem testes)
        run: ./gradlew clean build bootWar -x test --stacktrace

      - name: Publicar WAR
        uses: actions/upload-artifact@v4
        with:
          name: criandoAPI-war
          path: build/libs/*.war

  testeController:
    name: "testes · testeController"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de controller
        run: ./gradlew test --tests 'br.com.criandoapi.controller.*' --stacktrace

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-controller
          path: build/test-results/test/*.xml
          if-no-files-found: error

      - name: Publicar cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-controller
          path: build/jacoco/test.exec
          if-no-files-found: error

  testeService:
    name: "testes · testeService"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de service
        run: ./gradlew test --tests 'br.com.criandoapi.services.*' --stacktrace

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-service
          path: build/test-results/test/*.xml
          if-no-files-found: error

      - name: Publicar cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-service
          path: build/jacoco/test.exec
          if-no-files-found: error

  # Não há testes dedicados de repository: a camada é exercitada pelos testes de
  # integração (JPA + Flyway + H2) do pacote integration.
  testeRepository:
    name: "testes · testeRepository"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de repository / integração
        run: ./gradlew test --tests 'br.com.criandoapi.integration.*' --stacktrace

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-repository
          path: build/test-results/test/*.xml
          if-no-files-found: error

      - name: Publicar cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-repository
          path: build/jacoco/test.exec
          if-no-files-found: error

  gate-qualidade:
    name: "gates · gate-qualidade"
    needs: [testeController, testeService, testeRepository]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: results

      - uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: build/jacoco-merged

      - name: Verificar execução e falhas dos testes
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          rows, problems = [], []
          for suite in ('controller', 'service', 'repository'):
              total = failed = skipped = 0
              for f in glob.glob(f'results/test-results-{suite}/*.xml'):
                  s = ET.parse(f).getroot()
                  total += int(s.get('tests', 0))
                  failed += int(s.get('failures', 0)) + int(s.get('errors', 0))
                  skipped += int(s.get('skipped', 0))
              rows.append(f"| {suite} | {total} | {failed} | {skipped} |")
              if total == 0:
                  problems.append(f"{suite}: nenhum teste executado")
              if failed:
                  problems.append(f"{suite}: {failed} falha(s)")
              if skipped:
                  problems.append(f"{suite}: {skipped} teste(s) ignorado(s)")

          table = "| Suíte | Total | Falhas | Ignorados |\n|---|---|---|---|\n" + "\n".join(rows)
          print(table)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write("### Gate de qualidade\n" + table + "\n")

          if problems:
              sys.exit("Gate reprovado: " + "; ".join(problems))
          EOF

      - name: Cobertura combinada (mínimo de 70% das linhas)
        run: ./gradlew jacocoMergedReport jacocoMergedVerification --stacktrace

      - name: Resumo da cobertura
        if: always()
        run: |
          python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          path = 'build/reports/jacoco/jacocoMergedReport/jacocoMergedReport.xml'
          if not os.path.exists(path):
              raise SystemExit(0)
          rows = []
          for c in ET.parse(path).getroot().findall('counter'):
              missed, covered = int(c.get('missed')), int(c.get('covered'))
              rows.append(f"| {c.get('type')} | {covered} | {missed} | {covered / (missed + covered):.1%} |")
          table = "| Métrica | Cobertas | Perdidas | % |\n|---|---|---|---|\n" + "\n".join(rows)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write("### Cobertura (JaCoCo)\n" + table + "\n")
          EOF

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoMergedReport/html
          if-no-files-found: ignore

  gate-seguranca-codigo:
    name: "gates · gate-seguranca-codigo"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar para análise
        run: ./gradlew compileJava --no-build-cache

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  # Compara o grafo de dependências do PR com o da base e reprova vulnerabilidade alta ou superior.
  # Só roda em PRs para a develop: a main não recebe snapshot (merges do workflow não disparam push),
  # e sem base o review trataria todas as dependências como novas.
  gate-seguranca-dependencias:
    name: "gates · gate-seguranca-dependencias"
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Risco aceito: spring-webmvc 6.2.x não tem versão corrigida (só Spring 7.0.9 / Spring Boot 4).
          # A API não usa XsltView nem SSE com fragmentos de view. Remover ao migrar para o Spring Boot 4.
          allow-ghsas: GHSA-pc63-qcmh-9cmg, GHSA-j9f9-w8pj-32f8

  # Roda apenas depois do CI verde do push na develop (needs: gate-qualidade).
  # Os checks obrigatórios da main já existem no SHA da develop, então o merge é liberado de imediato.
  merge-automatico-main:
    name: "promover · merge-automatico-main"
    needs: [gate-qualidade, gate-seguranca-codigo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Abrir PR develop -> main e mergear (merge commit)
        run: |
          AHEAD=$(gh api "repos/$GH_REPO/compare/main...develop" -q .ahead_by)
          if [ "$AHEAD" = "0" ]; then
            echo "develop não tem commits novos em relação à main. Nada a promover."
            exit 0
          fi

          PR=$(gh pr list --base main --head develop --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head develop \
              --title "Promove develop para main ($GITHUB_SHA)" \
              --body "Promoção automática: CI verde na develop no commit $GITHUB_SHA."
            PR=$(gh pr list --base main --head develop --state open --json number -q '.[0].number')
          fi
          echo "PR de promoção: #$PR"

          # --auto falha se o PR já estiver liberado; nesse caso faz o merge direto.
          gh pr merge "$PR" --merge --auto || gh pr merge "$PR" --merge

  # Abre uma issue quando qualquer etapa falha num push na develop (inclui a promoção para a main).
  notificar-falha:
    name: "notificar · notificar-falha"
    needs:
      - validate-git-constraints
      - build
      - testeController
      - testeService
      - testeRepository
      - gate-qualidade
      - gate-seguranca-codigo
      - merge-automatico-main
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Abrir issue de falha
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          TITLE="CI falhou na develop ($SHORT)"
          EXISTE=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$EXISTE" ]; then
            echo "Issue #$EXISTE já aberta para este commit."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "A pipeline falhou no push da develop (commit $GITHUB_SHA). A promoção para a main não foi concluída.

          Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
