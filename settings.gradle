pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // Espelho do Maven Central (fallback para HTTP 429 no runner do GitHub)
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'criandoAPI'
