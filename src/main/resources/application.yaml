spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: criandoAPI
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/apiParaEstudoDeAutomacao?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/criandoAPI}

api:
  version-prefix: ${API_VERSION_PREFIX:/v1}
  admin:
    email: ${API_ADMIN_EMAIL:}
    senha: ${API_ADMIN_SENHA:}
    nome: ${API_ADMIN_NOME:Administrador}
  manutencao:
    enabled: ${API_MANUTENCAO_ENABLED:false}

management:
  endpoints:
    web:
      base-path: ${api.version-prefix}/actuator
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: ${api.version-prefix:/v1}/swagger-ui.html
  api-docs:
    path: ${api.version-prefix:/v1}/api-docs
  show-actuator: true
