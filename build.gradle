plugins {
    id 'java'
    id 'jacoco'
    id 'war'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com'
version = '0.0.1-SNAPSHOT'
description = 'criandoAPI'

// Tomcat 10.1.55 (padrão do Spring Boot 3.5.16) tem avisos críticos corrigidos na 10.1.58.
ext['tomcat.version'] = '10.1.61'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

war {
    enabled = false
}

bootWar {
    enabled = true
    archiveFileName = "${project.name}.war"
}

tasks.named('test') {
    useJUnitPlatform { excludeTags "mysql" }
}
// Real MySQL verification is explicit and fails when Docker is unavailable.
tasks.register('mysqlTest', Test) {
    description = 'Executa integracao com MySQL isolado em Docker'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    shouldRunAfter tasks.named('test')
}

jacoco {
    toolVersion = '0.8.13'
}

// Cada job de teste do CI gera o seu test.exec. O gate de qualidade baixa todos em
// build/jacoco-merged/ e calcula a cobertura combinada.
def jacocoMergedData = fileTree(layout.buildDirectory.dir('jacoco-merged')) {
    include '**/*.exec'
}

tasks.register('jacocoMergedReport', JacocoReport) {
    description = 'Relatório de cobertura combinando os .exec de build/jacoco-merged'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoMergedVerification', JacocoCoverageVerification) {
    description = 'Falha se a cobertura combinada ficar abaixo do mínimo'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}
