// Fixa o Jackson usado pelo próprio plugin do Spring Boot (classpath do build): 2.21.4 e 3.1.5 têm avisos altos.
buildscript {
    dependencies {
        constraints {
            classpath('com.fasterxml.jackson.core:jackson-core:2.21.8')
            classpath('com.fasterxml.jackson.core:jackson-databind:2.21.8')
            classpath('tools.jackson.core:jackson-core:3.1.8')
            classpath('tools.jackson.core:jackson-databind:3.1.8')
        }
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com'
version = '0.0.1-SNAPSHOT'
description = 'criandoAPI'

// Boot 4.1.1 traz Tomcat 11.0.24, com avisos críticos corrigidos na 11.0.25 (o override 10.1.x da linha 3.5 não vale mais).
ext['tomcat.version'] = '11.0.25'

// Fixa o Jackson 3 (3.1.5 do Boot tem aviso alto no jackson-core, corrigido na 3.1.7) e o Jackson 2 (usado pelo jjwt-jackson): 2.21.5 tem avisos altos.
ext['jackson-bom.version'] = '3.1.8'
ext['jackson-2-bom.version'] = '2.21.8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'

    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

war {
    enabled = false
}

bootWar {
    enabled = true
    archiveFileName = "${project.name}.war"
}

tasks.named('test') {
    useJUnitPlatform { excludeTags "mysql" }
}
// Real MySQL verification is explicit and fails when Docker is unavailable.
tasks.register('mysqlTest', Test) {
    description = 'Executa integracao com MySQL isolado em Docker'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    shouldRunAfter tasks.named('test')
}

jacoco {
    toolVersion = '0.8.16'
}

// Cada job de teste do CI gera o seu test.exec. O gate de qualidade baixa todos em
// build/jacoco-merged/ e calcula a cobertura combinada.
def jacocoMergedData = fileTree(layout.buildDirectory.dir('jacoco-merged')) {
    include '**/*.exec'
}

tasks.register('jacocoMergedReport', JacocoReport) {
    description = 'Relatório de cobertura combinando os .exec de build/jacoco-merged'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoMergedVerification', JacocoCoverageVerification) {
    description = 'Falha se a cobertura combinada ficar abaixo do mínimo'
    group = 'verification'
    executionData.from(jacocoMergedData)
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}
